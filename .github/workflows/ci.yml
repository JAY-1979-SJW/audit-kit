name: CI

# 커밋마다 자동 실행되는 가벼운 검사만 한다(변이 테스트는 무겁고 느려 mutation.yml 에 따로 둔다).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: 공개 저장소 위생 검사
        # 일반 규칙은 항상 돈다. 추가 금지어는 저장소 비밀 HYGIENE_PATTERNS 로 주입하며,
        # 비밀이 없으면(포크 PR 등) 일반 규칙만 검사한다.
        env:
          HYGIENE_PATTERNS: ${{ secrets.HYGIENE_PATTERNS }}
        run: python scripts/check_public_hygiene.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: pytest
        run: python -m pytest tests -q
      - name: audit-kit std 자기 검사
        # 2026-09-27: 기존 치명 위반 11건(STD-04)과 mypy 오류 41건(str | None 인자 등)을
        # 모두 정리해 --fail-on critical 로 조이고 mypy 도 켰다(그전까진 --no-mypy 였다).
        # 2026-09-29: std/run은 기본이 세트 실행이지만, 위 pytest 단계에서 이미 전체를
        # 돌렸으므로 --solo 로 run(pytest 포함)의 중복 실행을 막는다.
        run: python -m audit_kit std --path . --fail-on critical --solo
