# 도구별 공식 개발자 센터 등록부 (2026-09-27 조사)
# py_docs_guard.py 가 읽는다: 새 코드에 아래 imports/patterns 가 추가되면, 이번 세션에 그 도구의 공식 문서를
# 조회(WebFetch/WebSearch/Context7)한 기록이 있어야 저장을 허용한다 (조항 DOC-02).
#
# 필드
#   name       표시 이름 (조회 기록의 키)
#   imports    import 최상위 모듈명. 비어 있으면 import 로는 강제하지 않는다
#   patterns   (선택) 새 코드에서 찾을 정규식. AutoCAD·Excel 처럼 import 가 없는 도구용
#   pip        pip 패키지 이름
#   docs       방문할 공식 문서 주소 (실제로 열어 확인한 것)
#   domains    이 호스트(와 하위 도메인)로 WebFetch 하면 조회로 인정
#   url_prefix (선택) github.com 처럼 여러 프로젝트가 공유하는 호스트는 주소 접두어로만 인정
#   notes      문서에서 직접 확인한 코딩 전 주의점 (기억에 의존한 내용은 넣지 않는다)
#   verified   조사 시 확인 결과. 'fetch ok' 아닌 것은 다시 확인해야 한다
# 새 도구를 쓰기 시작하면 이 파일에 먼저 추가한다 (공식 문서 URL 을 열어 확인한 뒤).

