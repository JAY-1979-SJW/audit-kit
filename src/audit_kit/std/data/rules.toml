# 개발 기준서 규칙 원장 (v2, 2026-09-27)
# 모든 규칙은 근거(source)와 검사 방법(check)을 가진다. 근거 없는 규칙은 넣지 않는다.
# check.kind: ruff = ruff 규칙 ID / tool = 외부 도구 / custom = audit-kit std 가 직접 구현(AST) / manual = 사람·리뷰
# severity: critical(반드시 수정) / improve(개선) / info(참고)
# ruff 규칙 ID 는 ruff 0.16.9 에서 `ruff rule <ID>` 로 존재를 확인했다. 버전을 올리면 다시 확인한다.

[meta]
version = 2
ruff_pinned = "0.16.9"
claude_md_max_lines = 200   # 공식 권고: CLAUDE.md 파일당 200줄 미만 (code.claude.com/docs/en/memory)

# ---------------------------------------------------------------- 표준 코드 (STD)
[[rule]]
id = "STD-01"
title = "텍스트 파일 인코딩 명시"
severity = "critical"
check = { kind = "ruff", ids = ["PLW1514"] }
source = "https://docs.astral.sh/ruff/rules/unspecified-encoding/"

[[rule]]
id = "STD-02"
title = "경로는 pathlib, 하드코딩 절대경로 금지"
severity = "improve"
check = { kind = "ruff", ids = ["PTH"] }
custom = "ABS-PATH-LITERAL"          # 문자열 리터럴의 'C:\\...', '/Users/...' 검출
source = "https://docs.python.org/3/library/pathlib.html"

[[rule]]
id = "STD-03"
title = "print 대신 logging"
severity = "improve"
check = { kind = "ruff", ids = ["T201", "T203"] }
source = "https://docs.python.org/3/howto/logging.html"

[[rule]]
id = "STD-04"
title = "except: / except Exception 남용 금지, 예외 삼키기 금지"
severity = "critical"
check = { kind = "ruff", ids = ["E722", "BLE001", "S110", "SIM105"] }
source = "https://docs.astral.sh/ruff/rules/blind-except/"

[[rule]]
id = "STD-05"
title = "가변 기본 인자 금지"
severity = "critical"
check = { kind = "ruff", ids = ["B006", "B008", "RUF012"] }
source = "https://docs.astral.sh/ruff/rules/mutable-argument-default/"

[[rule]]
id = "STD-06"
title = "전역 변수 수정 최소화"
severity = "improve"
check = { kind = "ruff", ids = ["PLW0603", "PLW0602"] }
source = "https://docs.astral.sh/ruff/rules/global-statement/"

[[rule]]
id = "STD-07"
title = "공개 함수 타입 힌트, 최신 문법(list[str], X | None)"
severity = "improve"
check = { kind = "ruff", ids = ["UP006", "UP007", "UP045"] }
also = { kind = "tool", name = "mypy" }
source = "https://peps.python.org/pep-0585/"

[[rule]]
id = "STD-08"
title = "복잡도 10, 인자 6, 문장 50 이하"
severity = "improve"
check = { kind = "ruff", ids = ["C901", "PLR0913", "PLR0915", "PLR0912"] }
source = "https://docs.astral.sh/ruff/rules/complex-structure/"

[[rule]]
id = "STD-09"
title = "비밀값(키·비밀번호)을 코드에 쓰지 않는다"
severity = "improve"      # ruff S105 는 변수 이름 기반 휴리스틱이라 오탐이 있어(실제 코드 검증) 개선 등급
check = { kind = "ruff", ids = ["S105", "S106", "S107"] }
also = { kind = "tool", name = "bandit" }
source = "https://docs.astral.sh/ruff/rules/hardcoded-password-string/"

[[rule]]
id = "STD-10"
title = "미사용 import·변수·인자·주석 처리된 죽은 코드 제거"
severity = "improve"
check = { kind = "ruff", ids = ["F401", "F841", "ARG", "ERA001"] }
also = { kind = "tool", name = "vulture" }
source = "https://docs.astral.sh/ruff/rules/unused-import/"

[[rule]]
id = "STD-11"
title = "테스트는 tests/ 아래 pytest, 루트에 test_*.py·일회성 스크립트 금지"
severity = "info"
check = { kind = "custom", name = "ROOT-TEST-SCRIPT" }
source = "https://docs.pytest.org/en/stable/explanation/goodpractices.html"

[[rule]]
id = "STD-12"
title = "subprocess 출력을 text=True(또는 universal_newlines=True) 로 받을 때는 encoding 을 명시한다"
severity = "critical"    # 실측: UTF-8 을 내보내는 자식 프로세스를 로케일(cp949)로 읽다가 stdout 이 None 이 되어 hook 이 죽는 실제 장애로 확인됨 (2026-09-27)
check = { kind = "custom", name = "SUBPROCESS-TEXT-NO-ENCODING" }
source = "https://docs.python.org/3/library/subprocess.html#subprocess.Popen"   # text 모드는 encoding 미지정 시 로케일 기본 인코딩을 쓴다고 명시

# ---------------------------------------------------------------- 중복 방지 (DUP)
[[rule]]
id = "DUP-01"
title = "같은 이름 함수·클래스 재정의 금지"
severity = "critical"
check = { kind = "ruff", ids = ["F811"] }
source = "https://docs.astral.sh/ruff/rules/redefined-while-unused/"

[[rule]]
id = "DUP-02"
title = "같은 프로젝트 안에서 본문이 같은 코드 블록 금지"
severity = "improve"
check = { kind = "tool", name = "pylint duplicate-code (R0801)" }
custom = "FUNC-BODY-DUP"              # 함수 본문 정규화 해시
source = "https://pylint.readthedocs.io/en/stable/user_guide/messages/refactor/duplicate-code.html"

[[rule]]
id = "DUP-03"
title = "백업·복사 파일 금지: *_backup*, *_old.py, *_v2.py, *_copy.py"
severity = "improve"
check = { kind = "custom", name = "COPY-FILENAME" }
source = "표준 개발 관행: 이력은 git 으로 관리 (git-scm.com/book)"

[[rule]]
id = "DUP-04"
title = "프로젝트 간 복사 금지: 두 곳 이상에서 쓰는 코드는 공용 라이브러리로"
severity = "improve"
check = { kind = "manual", how = "dupscan(33) 보고서 참조 + dup-checker 에이전트" }
source = "docs/개발표준_설계서.md 3.7"

# ---------------------------------------------------------------- 효율 (EFF)
[[rule]]
id = "EFF-01"
title = "불필요한 리스트·dict 재구성, 반복문 안 수동 컴프리헨션 금지"
severity = "improve"
check = { kind = "ruff", ids = ["PERF101", "PERF102", "PERF401", "PERF402", "PERF403", "C400", "C416", "C419"] }
source = "https://docs.astral.sh/ruff/rules/manual-list-comprehension/"

[[rule]]
id = "EFF-02"
title = "반복 멤버십 검사는 list 가 아니라 set/dict (순서를 유지하는 중복 제거는 예외)"
severity = "info"      # 작은 목록에서는 영향이 없어 참고용
check = { kind = "custom", name = "LIST-MEMBERSHIP-IN-LOOP" }
source = "https://wiki.python.org/moin/TimeComplexity"      # list 'in' O(n), set/dict 평균 O(1)

[[rule]]
id = "EFF-03"
title = "반복문 안에서 같은 파일·DB 연결·COM 앱을 반복해 열지 않는다 (밖에서 한 번에). 반복마다 다른 파일을 여는 것과 재시도·페이지 요청은 예외"
severity = "info"      # 실제 코드 956개 파일 검증에서 확인된 진짜 위반이 없어 참고용
check = { kind = "custom", name = "IO-IN-LOOP" }
source = "docs/개발표준_설계서.md 3.10 (근거 확인 필요: 일반 원칙)"

[[rule]]
id = "EFF-04"
title = "큰 엑셀을 읽기만 할 때는 openpyxl read_only 사용, wb.close() 호출 (저장하는 편집용은 예외)"
severity = "info"      # 파일 크기를 정적으로 알 수 없어 참고용
check = { kind = "custom", name = "OPENPYXL-MODE" }
source = "https://openpyxl.readthedocs.io/en/stable/optimized.html"

[[rule]]
id = "EFF-05"
title = "엑셀 셀 값을 하나씩 읽지 말고 범위·행 단위로 읽는다 (값·스타일 쓰기는 예외)"
severity = "info"
check = { kind = "custom", name = "CELL-BY-CELL" }
source = "https://openpyxl.readthedocs.io/en/stable/optimized.html"

[[rule]]
id = "EFF-06"
title = "스크립트가 새로 띄운 Office COM 앱(Excel·Word)은 try/finally 로 Quit·해제, 스레드에서는 CoInitialize. 이미 실행 중인 AutoCAD 에 붙은 경우 Quit 금지"
severity = "critical"
check = { kind = "custom", name = "COM-CLEANUP", platform = "windows" }
source = "https://timgolden.me.uk/pywin32-docs/pythoncom__CoInitialize_meth.html"

# ---------------------------------------------------------------- 오류 방지 (ERR)
[[rule]]
id = "ERR-01"
title = "존재하지 않는 모듈 import 금지 (환각 import)"
severity = "critical"
check = { kind = "tool", name = "mypy import-not-found" }
custom = "IMPORT-RESOLVE"             # 실제 import 가능 여부
source = "https://mypy.readthedocs.io/en/stable/error_code_list.html"

[[rule]]
id = "ERR-02"
title = "존재하지 않는 속성·메서드 호출 금지 (환각 API)"
severity = "critical"
check = { kind = "tool", name = "mypy attr-defined" }
also = { kind = "hook", name = "py_api_guard.py", how = "PreToolUse Write|Edit|MultiEdit, 저장 전에 모듈 소스를 직접 읽어(import 안 함) 새로 쓰는 `모듈.속성` 을 확인. mypy 는 stub 없는 패키지를 Any 로 봐 놓치는 경우를 보완. 확실히 없을 때만 차단, 인스턴스 메서드는 범위 밖" }
source = "https://mypy.readthedocs.io/en/stable/error_code_list.html"

[[rule]]
id = "ERR-03"
title = "shell=True 등 위험한 실행 금지"
severity = "critical"
check = { kind = "ruff", ids = ["S602", "S605"] }
source = "https://docs.astral.sh/ruff/rules/subprocess-popen-with-shell-equals-true/"

[[rule]]
id = "ERR-04"
title = "수정한 코드는 완료 보고 전에 실제로 실행·테스트해 확인하고, 확인한 것과 가정을 구분해 보고한다 (hook 이 직접 검증)"
severity = "critical"
check = { kind = "hook", name = "py_stop_check.py + py_evidence.py + py_verify.py", how = "T1 테스트가 수정 줄을 실행 > T3 AI 실행 성공 기록 > T2 안전한 모듈의 import 성공. 1회 차단 후 통과" }
source = "https://code.claude.com/docs/en/best-practices"   # "a Stop hook runs your check as a script and blocks the turn from ending until it passes"

[[rule]]
id = "ERR-05"
title = "테스트 설정: 경고를 오류로(filterwarnings=error), 미등록 마커 금지(--strict-markers), 무한 대기 방지(pytest-timeout)"
severity = "info"      # 도입 초기에는 기존 테스트가 깨질 수 있어 참고 등급
check = { kind = "custom", name = "PYTEST-SETTINGS" }
source = "https://docs.pytest.org/en/stable/how-to/capture-warnings.html"

[[rule]]
id = "ERR-06"
title = "훅(hook) 스크립트의 진입점은 예상 밖 입력에도 세션을 막지 않도록 전체를 넓은 예외로 감싼다"
severity = "improve"    # STD-04(넓은 except 남용 금지)의 의도된 예외: hook 진입점에만 한정. 공식 문서 확인:
                         # exit 1(처리 못한 예외)은 비차단이라 세션 자체가 막히지는 않지만, 그 훅이 하려던 검사가
                         # 조용히 안 돈 채로(JSON 을 못 내므로) 넘어가고 stderr 에 트레이스백만 남는다 — critical 은 과함
check = { kind = "custom", name = "HOOK-ENTRYPOINT-UNGUARDED" }
source = "https://code.claude.com/docs/en/hooks"   # "Without valid JSON on stdout, Claude Code treats exit code 1
                                                    # as a non-blocking error" — 2026-09-27 WebFetch 로 원문 확인.
                                                    # 실측: 비문자열 cwd 로 예외 미포착 시 실제로 exit 1 + 트레이스백 발생

[[rule]]
id = "ERR-07"
title = "훅이 파일 '존재'만으로 그 파일의 종류를 판단해 차단·허용을 결정하지 않는다 (내용의 고유 서명까지 확인)"
severity = "improve"    # AST 로는 "존재 확인 직후 내용 검증 없이 차단/허용 판정으로 이어지는가"만 보는 휴리스틱이라
                         # 오탐·미탐이 있을 수 있다 (STD-09 와 같은 종류의 한계)
check = { kind = "custom", name = "EXISTENCE-ONLY-GATING" }
source = "실측 사례 — 외부 근거 문서 없음"

[[rule]]
id = "ERR-08"
title = "test_* 함수에서 `bad = [x for x in SRC if ...]; assert not bad` 류는 SRC 가 비어있지 않다는 별도 sanity assert 없이 쓰면 안 된다 (공허하게 항상 통과할 위험)"
severity = "improve"    # AST 로는 "파생 소스가 정확히 같은 식일 때"만 sanity assert 를 찾아내는
                         # 휴리스틱이라 오탐·미탐이 있을 수 있다 (ERR-07 과 같은 종류의 한계)
check = { kind = "custom", name = "VACUOUS-COLLECTION-ASSERT" }
source = "실측 사례 — 외부 근거 문서 없음"

[[rule]]
id = "ERR-09"
title = "테스트의 monkeypatch 가 안 먹히는 것 같으면, 그 상수/설정값을 다른 모듈이 독자적으로 다시 import 하고 있는지부터 의심한다 (이중 바인딩 파편화)"
severity = "info"    # 자동 검사 불가 — 교차 모듈 데이터흐름 분석이 필요해 AST 휴리스틱 범위 밖. 진단
                     # 가이드로만 남긴다(사람/AI 가 디버깅할 때 먼저 확인할 목록).
check = { kind = "manual", how = "증상: monkeypatch.setattr(모듈A, '상수', 값) 을 했는데 특정 코드경로만 계속 옛 값을 쓰는 것처럼 보임. 확인 순서: (1) 그 상수를 쓰는 실제 함수가 `from 모듈A import 상수` 가 아니라 `from 모듈B import 상수` 처럼 다른 모듈에서 import 하는지 grep, (2) 모듈B 가 그 상수를 원본 모듈C 에서 다시 import 해 자기 것으로 굳혀놨는지 확인, (3) 실제 pytest 프로세스 안에서 두 모듈의 값을 직접 print 해 대조(추측 금지 — 이번 사례처럼 직접 찍어보기 전까지 두 경로가 갈라지는 걸 코드만 읽어서는 확신할 수 없었음)." }
source = "실측 사례 — 외부 근거 문서 없음"

# ---------------------------------------------------------------- 훅 판정 로그 태그 (LOG)
# 아래 2개는 개별 정책이 아니라 py_stats.py 집계에 실제로 찍히는 "전체 판정" 로그 태그다.
# 근거는 이미 문서화된 개별 조항들(STD-*, ERR-04)에 있고, 여기서는 py_stats 출력을 rules.toml과
# 대조할 때 고아로 보이지 않도록 등록만 한다(2026-09-28, py_project_health_check 점검 중 발견).
[[rule]]
id = "LINT"
title = "py_post_edit.py 전체 파이프라인의 최종 판정(block/pass) 로그 태그 — 근거는 STD-01/04/05 등 개별 ruff 조항"
severity = "info"
check = { kind = "hook", name = "py_post_edit.py", how = "log_decision(\"post_edit\", \"LINT\", outcome, ...) — 치명 규칙(E9/F/B/PLE/PLW1514/BLE001/E722) 중 하나라도 남으면 block, 없으면 pass" }
source = "docs/개발표준_설계서.md 3.2절"

[[rule]]
id = "TEST"
title = "py_stop_check.py 전체 파이프라인의 최종 판정(테스트 결과) 로그 태그 — 근거는 ERR-04"
severity = "info"
check = { kind = "hook", name = "py_stop_check.py", how = "log_decision(\"stop_check\", \"TEST\", outcome, ..., detail=tests.status)" }
source = "docs/개발표준_설계서.md 3.3절"

# ---------------------------------------------------------------- 기준서 자체 (DOC)
[[rule]]
id = "DOC-01"
title = "CLAUDE.md 는 200줄 미만, 세부는 docs/·rules/ 로 분리"
severity = "info"
check = { kind = "custom", name = "CLAUDE-MD-LINES" }
source = "https://code.claude.com/docs/en/memory"

[[rule]]
id = "DOC-02"
title = "도구·라이브러리를 새로 쓰기 전에 그 도구의 공식 개발자 센터를 조회한다 (hook 이 강제)"
severity = "critical"
check = { kind = "hook", name = "py_docs_guard.py", registry = "standard/docs_registry.toml" }
source = "https://code.claude.com/docs/en/best-practices"   # 검증할 수 없는 구현 금지, 검증 수단을 준다

[[rule]]
id = "DOC-03"
title = "실제로 import 하는 외부 라이브러리는 docs_registry.toml 에 등록한다 (조회 대상 등록부 자체의 공백 방지)"
severity = "info"    # 2026-09-28: audit-kit checks.check_imports 가 이미 REGISTRY-GAP 으로 구현·보고하고
                      # 있었는데 이 조항 자체가 없어서 "규칙 ID 단일 출처" 자동검증에서 고아 검사로 발견됨
check = { kind = "custom", name = "REGISTRY-GAP" }
source = "https://code.claude.com/docs/en/best-practices"   # DOC-02(개발자 센터 조회 강제)가 실제로 작동하려면
                                                              # 조회 대상 등록부 자체가 비어있지 않아야 한다

# ---------------------------------------------------------------- 절차 (PROC)
[[rule]]
id = "PROC-01"
title = "기존 hook 함수의 동작을 고치기 전에, 그 함수를 이미 검증하는 기존 테스트가 있는지 먼저 확인한다 (hook 이 알림)"
severity = "improve"    # 2026-09-27 실측: is_ancestor_or_self() 방향을 코드만 보고 버그로 판단해 고쳤다가
                         # test_deleting_inside_a_project_is_only_ask 가 이미 검증하던 의도된 동작을 깨뜨림
check = { kind = "hook", name = "py_test_intent_guard.py", how = "PreToolUse Write|Edit|MultiEdit, claude-user/hooks/*.py 의 함수 본문을 바꿀 때 그 함수를 참조하는 기존 테스트를 알려준다(차단 안 함)" }
source = "실측 사례 — 외부 근거 문서 없음"

[[rule]]
id = "PROC-02"
title = "여러 세션이 같은 파일(rules.toml 등)을 동시에 건드리면 그 파일이 다른 세션의 최근 클레임을 알려준다 (hook 이 알림)"
severity = "improve"    # 2026-09-28 실측: rules.toml 을 두 세션이 동시에 건드릴 뻔한 일이 하루에도 여러 번
                         # 있었고, 그때마다 사람이 SendMessage 로 수동 확인해야 했다
check = { kind = "hook", name = "py_ecosystem_claim_guard.py", how = "PreToolUse Write|Edit|MultiEdit, HOTSPOT_NAMES(rules.toml/docs_registry.toml/ruff.toml)를 다른 session_id 가 15분 이내에 건드렸으면 알려준다(차단 안 함, ~/.claude/ecosystem_claims.json 공유)" }
source = "실측 사례 — 외부 근거 문서 없음"

[[rule]]
id = "PROC-03"
title = "발견한 버그·문제는 그 프로젝트의 GitHub Issues로 등록하고, 프로그램 전체 완성도는 36. program-dashboard(G1/G2/G3)로 추적한다"
severity = "improve"    # 2026-09-29: 대화 요약에만 남긴 발견 사항은 세션이 끝나면 사라진다 — 실제로
                         # 다른 프로젝트 세션에서 "보고만 하고 넘어간" 항목들이 다음 세션에 안 이어질
                         # 뻔했다. GitHub Issues(개별 결함)와 program-dashboard(전체 완성도, G1=구현/
                         # G2=품질(audit-kit 치명 findings)/G3=검증(테스트))는 데이터 모델이 달라
                         # 역할을 분리한다 — 버그 목록을 대시보드 스키마에 억지로 넣으면 "파일이
                         # 존재하니 통과"로 오판된다.
check = { kind = "manual", how = "hook 자동화는 아직 없음(감지 대상이 '버그를 발견했다'는 자연어 판단이라 정적 검사로 걸기 어려움) — 세션 종료 전 스스로 확인: 이번 세션에서 보고한 문제가 GitHub Issues에 실제로 등록됐는지. 대시보드 연결은 그 프로젝트의 기반 데이터(이름·분류 체계 등)가 여러 곳에서 파편화돼 있으면 통일부터 먼저 한다" }
source = "실측 사례 — 외부 근거 문서 없음"

# ---------------------------------------------------------------- 협업 안전 (COLLAB)
[[rule]]
id = "COLLAB-01"
title = "Agent 도구로 쓰기 가능한 서브에이전트를 스폰할 때 isolation: \"worktree\" 를 빠뜨리면 막는다"
severity = "improve"    # 2026-09-27 실측 사례(여러 세션이 같은 audit-kit 작업 디렉터리를 동시에
                         # 건드리다 spec.py/cli.py 변경분이 뒤섞임) 재발 방지 — Claude Code 자체
                         # worktree 격리 기능을 "빠뜨리지 않고 쓰게" 강제할 뿐 새 기능은 아니라서
                         # critical 아님
check = { kind = "hook", name = "py_agent_worktree_guard.py", how = "PreToolUse Agent, 쓰기 가능(Write/Edit/MultiEdit/NotebookEdit 보유 또는 Bash/PowerShell 을 스스로 제한 안 한 기본형)한 서브에이전트를 isolation 없이 부르면 ask/deny, 읽기전용 서브에이전트는 통과" }
source = "https://code.claude.com/docs/en/sub-agents"   # isolation: "worktree" 파라미터, 2026-09-27 확인

[[rule]]
id = "COLLAB-02"
title = "isolation: \"worktree\" 를 넣었어도 cwd 가 올바른 프로젝트 저장소를 가리키지 않으면 막는다"
severity = "improve"    # 2026-09-27 실측 사례: 프로젝트 모음 폴더 처럼 자체 저장소가 없는
                         # 상위 폴더에서 불러 git 이 상위로 올라가 엉뚱한 조상 저장소(홈 디렉터리
                         # 전체)를 대상으로 worktree 가 만들어져 작업이 막힌 사례(wrong_repo)
check = { kind = "hook", name = "py_agent_worktree_guard.py", how = "isolation 지정 여부와 별개로 cwd 기준 git 저장소가 기대한 프로젝트와 다르면(wrong_repo) deny" }
source = "실측 사례 — 외부 근거 문서 없음"

[[rule]]
id = "COLLAB-03"
title = "worktree 로 격리된 동안 일반 쉘 리다이렉트(>, tee)로 worktree 밖에 쓰는 것을 막는다"
severity = "improve"    # Claude Code 공식 worktree 격리가 Write/Edit/git 리다이렉트만 보고 일반
                         # 쉘 리다이렉트는 안 보는 공백을 메우는 보완 hook — 저자도 "완벽한 차단은
                         # 아니다"로 스스로 명시(2026-09-27 html-scaffolder 등 실제 우회 확인)
check = { kind = "hook", name = "py_worktree_escape_guard.py", how = "PreToolUse Bash|PowerShell, linked worktree 안에서 >/>>/tee 또는 PowerShell -Path/-FilePath/-Destination/-LiteralPath 대상이 worktree 루트 밖(시스템 임시 폴더 제외)이면 ask/deny. 2026-09-28 점검에서 PowerShell 위치 인자·fd 리다이렉트·curl -o/wget -O 우회 3건 발견해 보강" }
source = "https://code.claude.com/docs/en/worktrees"   # "How Claude Code enforces isolation", 2026-09-27 확인

[[rule]]
id = "COLLAB-04"
title = "이번 세션이 새로 손댄 프로젝트 폴더는 독립 git 저장소+원격 연결+CI 워크플로를 갖춰야 한다"
severity = "improve"    # 사용자 지시("신규 폴더 생성시 깃허브 저장소와 ci 연결을 강제하는 훅을
                         # 하자") — 이번 세션이 실제로 두 번 겪은 문제(원격 누락, CI 누락) 재발 방지
check = { kind = "hook", name = "py_project_health_check.py", how = "Stop hook, roots 바로 아래 폴더 중 이번 세션이 실제로 건드린 것만 검사: (1)독립 .git (2)origin 원격 (3)CI 워크플로 3가지 중 하나라도 없으면 block(기본)/warn. project_health_exempt 설정으로 의도적 예외 지정 가능" }
source = "실측 사례 — 외부 근거 문서 없음"

# ---------------------------------------------------------------- 설계 결정 (ADR)
[[rule]]
id = "ADR-01"
title = "아키텍처에 영향을 주는 결정(DB 선택, 프레임워크 교체, 외부 서비스 도입 등)은 ADR(Architecture Decision Record)로 남긴다"
severity = "info"    # 2026-09-28: 규칙 선언까지만 - 실제 실행 자동화(내용 검토 등)는 audit-kit std 2단계 몫
check = { kind = "custom", name = "ADR-DIR-PRESENT" }   # doc/adr/ 또는 docs/adr/ 에 .md 파일이 1개 이상 있는지만 확인
                                                          # (npryce/adr-tools 의 기본 디렉터리 관행 - doc/adr)
source = "https://github.com/npryce/adr-tools , https://adr.github.io/"

# ---------------------------------------------------------------- 데이터베이스 (DB)
[[rule]]
id = "DB-01"
title = "DB 마이그레이션 파일은 위험한 패턴(컬럼/테이블 삭제, NOT NULL 제약 추가 등 잠금·다운타임 유발)이 없는지 린트한다"
severity = "info"    # 규칙 선언까지만 - 실제 실행 자동화는 audit-kit std 2단계 몫
check = { kind = "custom", name = "DB-MIGRATION-RISK-CONFIG-PRESENT" }   # CI에 squawk(또는 동급) 실행 단계가 있는지
source = "https://squawkhq.com/"   # "A linter and language server for Postgres migrations & SQL" -
                                    # 배포 전 잠금·다운타임을 유발하는 마이그레이션을 미리 잡는다

[[rule]]
id = "DB-02"
title = "실제 DB 스키마와 문서·마이그레이션 이력이 어긋나지 않는지(드리프트) 주기적으로 확인·문서화한다"
severity = "info"    # 규칙 선언까지만 - 실제 실행 자동화는 audit-kit std 2단계 몫
check = { kind = "custom", name = "DB-SCHEMA-DRIFT-CONFIG-PRESENT" }   # CI/설정에 tbls(diff/lint) 또는 migra 실행 흔적이 있는지
source = "https://github.com/k1LoW/tbls"   # tbls diff: 실제 DB와 생성된 문서를 비교해 구조 불일치를 잡음.
                                            # tbls lint: 테이블/컬럼 주석 누락 등 스키마 품질 규칙도 검사

# ---------------------------------------------------------------- API 계약 (API)
[[rule]]
id = "API-01"
title = "OpenAPI/GraphQL 스키마를 선언한 API는 그 스키마를 실제로 지키는지 계약 테스트로 검증한다"
severity = "info"    # 규칙 선언까지만 - 실제 실행 자동화는 audit-kit std 2단계 몫
check = { kind = "custom", name = "API-CONTRACT-TEST-CONFIG-PRESENT" }   # CI/의존성에 schemathesis 실행 흔적이 있는지
source = "https://schemathesis.readthedocs.io/en/stable/"   # OpenAPI/GraphQL 스키마에서 속성 기반 테스트를
                                                              # 자동 생성해 스키마와 실제 응답의 불일치를 찾는다

# ---------------------------------------------------------------- 안전 (SEC)
[[rule]]
id = "SEC-01"
title = "재귀 삭제·미러링·되돌릴 수 없는 git 명령은 보호 경로(C:/dev, 홈, OneDrive, .git 등)를 겨누면 차단하고, 그 밖에는 사용자 확인을 받는다 (hook 이 실행 전에 판정)"
severity = "critical"
check = { kind = "hook", name = "py_danger_guard.py", how = "PreToolUse Bash|PowerShell: deny(보호 경로·해석 불가·디스크) / ask(재귀 삭제·git reset --hard·push --force·iex·인코딩 명령·인터프리터 삭제 API). 내부 오류는 ask" }
source = "https://code.claude.com/docs/en/permissions"   # 규칙은 보안 경계가 아니며 PreToolUse hook 을 권장한다는 문서 설명

[[rule]]
id = "SEC-02"
title = "비밀값(클라우드·서비스 키, 개인키, password/secret/token 리터럴)을 코드에 쓰지 않는다. .env 류는 .gitignore 에 등재한다 (hook 이 저장 전에 판정)"
severity = "critical"
check = { kind = "hook", name = "py_secret_guard.py", how = "PreToolUse Write|Edit|MultiEdit, 모든 파일: 고확신(클라우드 키 형식·PEM 개인키)은 deny, 중간확신(이름 있는 변수 리터럴, 자리표시자 제외)은 ask. .env 류는 값 검사 없이 .gitignore 미등재만 경고. 값은 어떤 경우도 출력하지 않는다. 내부 오류는 통과" }
source = "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml , https://github.com/Yelp/detect-secrets/blob/master/detect_secrets/plugins/keyword.py"   # 2026-09-27 직접 확인한 공개 규칙을 단순화

[[rule]]
id = "SEC-03"
title = "저장소 전체에 이미 남아 있는 비밀값을 찾는다 (SEC-02 는 저장 시점만 보므로, 이전에 저장된 것은 이 검사가 잡는다)"
severity = "critical"
check = { kind = "custom", name = "SECRET-SCAN" }
source = "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml"   # 2026-09-27 확인

[[rule]]
id = "SEC-04"
title = ".env·개인키·비밀값 파일이 실제로 있으면 .gitignore 에 등재돼 있어야 한다 (내용은 열지 않는다)"
severity = "critical"
check = { kind = "custom", name = "GITIGNORE-SECRETS" }
source = "https://git-scm.com/docs/gitignore"

# ---------------------------------------------------------------- 운영·관리 (OPS)
# 외부 배포 전 필요한 체크리스트. 전부 info(참고) 등급이며, 실제 설정 파일은 각 프로젝트 루트에 두고
# "37. 운영관리" 폴더에서 진행 현황을 추적한다.
# 2026-09-27 확인: 7개 프로젝트(audit-kit, 32, 33, 00_공용라이브러리, program-dashboard, wifi-remote-tools,
# excel-contract-tools) 전체에서 아래 6개 도구 설정 흔적 없음(전부 미적용, OPS-06 은 해당 시).
# custom 검사 5개(OPS-01/03/04/05/06)는 audit-kit std 에 구현 완료(2026-09-28, audit-kit
# src/audit_kit/std/checks.py, 커밋 4b92d05). OPS-02(Uptime Kuma)는 외부 서비스라 manual 로 남는다.

[[rule]]
id = "OPS-01"
title = "릴리스 관리: semantic-release 설정, CODEOWNERS 파일"
severity = "info"
check = { kind = "custom", name = "RELEASE-CONFIG-PRESENT" }   # .releaserc*/release.config.* 및 CODEOWNERS 존재 확인 — audit-kit checks.check_release_config_present 구현 완료(2026-09-28)
source = "https://semantic-release.org/intro/ , https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners"

[[rule]]
id = "OPS-02"
title = "서버 모니터링: Uptime Kuma"
severity = "info"
check = { kind = "manual", how = "외부 모니터링 서비스라 저장소 검사로 확인 불가 — 배포 체크리스트로 확인" }
source = "https://github.com/louislam/uptime-kuma"

[[rule]]
id = "OPS-03"
title = "운영 오류 추적: Sentry SDK 연동"
severity = "info"
check = { kind = "custom", name = "ERROR-TRACKING-SDK-PRESENT" }   # pyproject.toml/requirements*.txt 의 sentry-sdk, package.json 의 @sentry/* 존재 확인 — audit-kit checks.check_error_tracking_sdk_present 구현 완료(2026-09-28)
source = "https://docs.sentry.io/"

[[rule]]
id = "OPS-04"
title = "문서화: MkDocs"
severity = "info"
check = { kind = "custom", name = "MKDOCS-CONFIG-PRESENT" }   # mkdocs.yml 존재 확인 — audit-kit checks.check_mkdocs_config_present 구현 완료(2026-09-28)
source = "https://www.mkdocs.org/"

[[rule]]
id = "OPS-05"
title = "기술부채 추적: SonarQube"
severity = "info"
check = { kind = "custom", name = "SONARQUBE-CONFIG-PRESENT" }   # sonar-project.properties 또는 CI 워크플로 내 SonarQube 스텝 존재 확인 — audit-kit checks.check_sonarqube_config_present 구현 완료(2026-09-28)
source = "https://docs.sonarsource.com/sonarqube-server/"

[[rule]]
id = "OPS-06"
title = "공급망 보안 (규제산업만, 선택): SBOM, Trivy"
severity = "info"      # 규제산업 대상 프로젝트에만 해당 — 그 외에는 적용 대상 아님
check = { kind = "custom", name = "SBOM-PRESENT" }   # CycloneDX bom.json/bom.xml 또는 Trivy 설정 존재 확인, 조건부(해당 시만) — audit-kit checks.check_sbom_present 구현 완료(2026-09-28)
source = "https://cyclonedx.org/ , https://trivy.dev/"

# 사용자 지시(2026-09-28): "과해도 다 넣어두자 결국 회사는 커질거야" — 지금 규모엔 과한 항목도
# 포함한다. OPS-09/12/15 는 저장소 검사로 확인 불가능한 외부 서비스/관행이라 manual 로 둔다.

[[rule]]
id = "OPS-07"
title = "의존성 자동 업데이트: Dependabot"
severity = "info"
check = { kind = "custom", name = "DEPENDABOT-CONFIG-PRESENT" }   # .github/dependabot.yml 존재 확인 — audit-kit checks.check_dependabot_config_present 구현 완료(2026-09-28)
source = "https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates"

[[rule]]
id = "OPS-08"
title = "사고 대응 문서화: 런북·포스트모템 템플릿"
severity = "info"
check = { kind = "custom", name = "RUNBOOK-PRESENT" }   # docs/runbook.md 또는 RUNBOOK.md 존재 확인 — audit-kit checks.check_runbook_present 구현 완료(2026-09-28)
source = "https://sre.google/sre-book/postmortem-culture/"   # Google SRE Book, Ch.15 — 요약/영향/타임라인/근본원인/액션아이템

[[rule]]
id = "OPS-09"
title = "백업 정책: restic"
severity = "info"
check = { kind = "manual", how = "백업이 실제로 실행됐는지는 저장소 검사로 확인 불가 — 백업 로그·스토리지를 직접 확인" }
source = "https://restic.readthedocs.io/en/stable/"

[[rule]]
id = "OPS-10"
title = "구조화된 로깅: structlog"
severity = "info"
check = { kind = "custom", name = "STRUCTURED-LOGGING-PRESENT" }   # structlog 가 선언된 의존성인지 확인 — audit-kit checks.check_structured_logging_present 구현 완료(2026-09-28)
source = "https://www.structlog.org/en/stable/"

[[rule]]
id = "OPS-11"
title = "개인정보 처리방침 (개인정보 다루는 프로젝트만, 선택)"
severity = "info"      # 개인정보를 다루는 프로젝트에만 해당 — 그 외에는 적용 대상 아님
check = { kind = "custom", name = "PRIVACY-POLICY-PRESENT" }   # PRIVACY.md 또는 docs/privacy.md 존재 확인, 조건부(해당 시만) — audit-kit checks.check_privacy_policy_present 구현 완료(2026-09-28)
source = "https://www.pipc.go.kr/np/default/page.do?mCode=H010000000"   # 개인정보보호위원회 자신의 처리방침 — 개인정보보호법 제30조 법정 기재사항의 실제 예시(2026-09-28 확인)

[[rule]]
id = "OPS-12"
title = "온콜·알림 에스컬레이션: PagerDuty"
severity = "info"
check = { kind = "manual", how = "에스컬레이션 정책은 PagerDuty 쪽 설정이라 저장소 검사로 확인 불가" }
source = "https://support.pagerduty.com/main/docs/services-and-integrations"

[[rule]]
id = "OPS-13"
title = "성능 모니터링(APM): OpenTelemetry"
severity = "info"
check = { kind = "custom", name = "APM-SDK-PRESENT" }   # opentelemetry-distro/-api 가 선언된 의존성인지 확인 — audit-kit checks.check_apm_sdk_present 구현 완료(2026-09-28)
source = "https://opentelemetry.io/docs/languages/python/getting-started/"

[[rule]]
id = "OPS-14"
title = "배포 전략·롤백 절차 문서화: GitHub Actions Environments"
severity = "info"
check = { kind = "custom", name = "DEPLOYMENT-DOC-PRESENT" }   # docs/deployment.md 또는 DEPLOYMENT.md 존재 확인 — audit-kit checks.check_deployment_doc_present 구현 완료(2026-09-28)
source = "https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment"

[[rule]]
id = "OPS-15"
title = "비용 모니터링(FinOps)"
severity = "info"
check = { kind = "manual", how = "클라우드 비용 대시보드·알림은 저장소 검사로 확인 불가 — 클라우드 콘솔에서 직접 확인" }
source = "https://www.finops.org/framework/"

# 2026-09-28: 업계 표준 프레임워크 3개(GitHub Community Health Files, 12-Factor App, DORA)를
# 조회한 결과 — GitHub Community Health Files 만 이 섹션과 같은 "파일 존재 확인" 패턴에 맞는다.
# 12-Factor App 은 코딩 아키텍처 관행(설정 분리, 무상태 프로세스 등)이라 OPS 가 아니라 STD/ERR
# 범주에 어울리고, DORA 5대 지표는 배포 이력 데이터가 있어야 계산되는 "측정값"이라 파일 검사로는
# 확인 불가 — 둘 다 이번엔 조항화하지 않는다(과도한 끼워맞추기로 판단).

[[rule]]
id = "OPS-16"
title = "커뮤니티 표준 파일: LICENSE, CONTRIBUTING, CODE_OF_CONDUCT, SECURITY"
severity = "info"
check = { kind = "custom", name = "COMMUNITY-FILES-PRESENT" }   # LICENSE/CONTRIBUTING.md/CODE_OF_CONDUCT.md/SECURITY.md 각각 존재 확인 — audit-kit checks.check_community_files_present 구현 예정
source = "https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/about-community-profiles-for-public-repositories , https://www.contributor-covenant.org/version/2/1/code_of_conduct/"

[[rule]]
id = "OPS-17"
title = "Docker 로 배포하는 서비스는 git HEAD 와 실제 컨테이너 코드의 드리프트를 검증하는 도구를 둔다 (Docker 배포가 있는 프로젝트만, 선택)"
severity = "info"      # Docker 기반 프로덕션 배포가 있는 프로젝트에만 해당 — 로컬 전용 도구·라이브러리는 적용 대상 아님
check = { kind = "custom", name = "DEPLOY-DRIFT-CHECK-PRESENT" }   # scripts/ops/deploy_drift_check.py(관례 경로) 존재 확인, 조건부(Dockerfile + docker-compose.yml 있는 프로젝트만) — audit-kit checks.check_deploy_drift_check_present 구현 예정
source = "실측 사례 — 외부 근거 문서 없음"

# ---------------------------------------------------------------- 프론트엔드 (FE)
# 2026-09-28: 웹 프로젝트(Next.js/TSX 앱 4개) 감사 중 실제 버그(react-hooks/static-components,
# react-hooks/set-state-in-effect, Next 16의 `next lint` 제거로 깨진 lint 스크립트)를 발견한 뒤 신설.
# audit-kit std 는 Python 전용이라 이 3개 조항은 전부 hook(js_post_edit.py) 전용 — also 필드 없이
# check.kind="hook" 로 직접 표시(ERR-04 방식과 동일, ERR-02 처럼 mypy 로 보완하는 이중 검사가 아니라
# 이게 유일한 검사라서 also 가 아니라 check 자체를 hook 으로 둠).

[[rule]]
id = "FE-01"
title = "TS/TSX/JS/JSX 저장 시 ESLint(eslint-config-next 포함) 위반 0건"
severity = "critical"
check = { kind = "hook", name = "js_post_edit.py", how = "PostToolUse Write|Edit|MultiEdit, 확장자 .ts/.tsx/.js/.jsx. 프로젝트의 node_modules/.bin/eslint 로 --fix 후 재검사, 남은 에러는 차단. node_modules 없으면 검사만 생략(차단 안 함)" }
source = "https://nextjs.org/docs/app/api-reference/config/eslint"   # 2026-08-25 확인: `next lint`는 Next.js 16부터 제거됨 — eslint CLI를 직접 부른다

[[rule]]
id = "FE-02"
title = "TS/TSX 저장 시 tsc --noEmit 타입 오류 0건"
severity = "critical"
check = { kind = "hook", name = "js_post_edit.py", how = "tsconfig.json 이 있는 프로젝트에서만, 파일 단위가 아니라 프로젝트 전체를 tsc --noEmit 으로 재검사(TS 는 파일 하나만 떼어 타입체크할 수 없음)" }
source = "https://www.typescriptlang.org/docs/handbook/compiler-options.html"

[[rule]]
id = "FE-03"
title = "정적 .html 파일은 html-validate(html-validate:standard+a11y+document) 통과"
severity = "critical"
check = { kind = "hook", name = "js_post_edit.py", how = "node_modules/.next/dist/build/out 밖의 .html 저장 시. .htmlvalidate.json 없으면 표준 설정 자동 생성(require-sri target=crossorigin — 로컬 리소스까지 SRI 요구하는 기본값은 과함, html-validate 공식 문서 확인)" }
source = "https://html-validate.org/usage/index.html"

[[rule]]
id = "FE-04"
title = "package.json/package-lock.json 저장 시 npm audit --audit-level=high 통과 (의존성 취약점)"
severity = "critical"
check = { kind = "hook", name = "js_post_edit.py", how = "package.json 또는 package-lock.json 저장 시 그 프로젝트에서 npm audit --audit-level=high 실행, high/critical 취약점 있으면 차단(moderate 이하는 정보만). 2026-09-28: 4개 Next.js 앱을 손으로 npm audit 돌려서 critical(Next.js 인증 없는 원격 코드 실행 등) 8~15건씩 발견한 뒤 신설 — ESLint/tsc/html-validate 는 이 종류의 문제를 못 잡는다" }
source = "https://docs.npmjs.com/cli/v10/commands/npm-audit"

[[rule]]
id = "FE-05"
title = "Next.js 프로젝트는 next build 가 실제로 성공한다 (정적 생성 오류 등은 eslint/tsc 로 못 잡음)"
severity = "critical"
check = { kind = "hook", name = "check_frontend.py", how = "check_project() 가 next.config.{ts,js,mjs,cjs} 존재하는 프로젝트에서만 npx next build 실행. eslint/tsc 는 파일 단위로 빠르게 돌 수 있어 PostToolUse(js_post_edit.py)에 있지만, 빌드는 분 단위로 걸려 일괄 점검 CLI(check_frontend.py) 전용 — 2026-09-28" }
source = "https://nextjs.org/docs/app/api-reference/cli/next"   # `next build` — "Creates an optimized production build". 2026-09-28 WebFetch 로 원문 확인(--debug-prerender 등 빌드 오류 디버깅 옵션 포함)

[[rule]]
id = "FE-06"
title = "운영 URL(package.json 의 homepage 필드)이 있는 웹 프로젝트는 security.txt(RFC 9116)를 제공한다"
severity = "info"    # 라이브 네트워크 점검이라 critical 로 막지 않음 - 다른 프로젝트 감사(2026-09-28) 중 수동으로 했던 걸 일반화
check = { kind = "hook", name = "check_frontend.py", how = "check_live_site() 가 package.json 의 homepage 필드로 배포 URL을 찾아 <homepage>/.well-known/security.txt 를 GET, 없으면 참고로만 보고" }
source = "https://www.rfc-editor.org/rfc/rfc9116"   # RFC 9116 "A File Format to Aid in Security Vulnerability Disclosure"

[[rule]]
id = "FE-07"
title = "운영 URL이 있는 웹 프로젝트는 OWASP 권장 보안 헤더(HSTS/CSP/X-Frame-Options 등)를 응답에 포함한다"
severity = "info"    # 라이브 네트워크 점검이라 critical 로 막지 않음, 헤더는 보통 앱 코드가 아니라 인프라(nginx 등)가 설정해 이 저장소 검사만으로는 고칠 수 없는 경우가 많음
check = { kind = "hook", name = "check_frontend.py", how = "check_live_site() 가 homepage URL 에 HEAD 요청을 보내 strict-transport-security/x-content-type-options/x-frame-options/referrer-policy/content-security-policy/permissions-policy 6개 헤더 존재 여부를 보고" }
source = "https://owasp.org/www-project-secure-headers/"   # OWASP Secure Headers Project — 공식 권장 헤더 목록

[[rule]]
id = "FE-08"
title = "운영 URL이 있는 웹 프로젝트는 viewport meta 태그를 포함한다 (모바일 대응 최소 요건)"
severity = "info"    # 라이브 네트워크 점검이라 critical 로 막지 않음
check = { kind = "hook", name = "check_frontend.py", how = "check_mobile() 이 homepage URL 을 GET 해서 <meta name=\"viewport\" ...> 존재 여부를 정규식으로 확인" }
source = "https://web.dev/articles/responsive-web-design-basics"   # 2026-09-28 WebFetch 확인: "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">" 권장

[[rule]]
id = "FE-09"
title = "배너/히어로 이미지는 반응형(srcset/sizes 또는 Next.js Image)으로 제공한다 (참고, 휴리스틱)"
severity = "info"    # 클래스명·alt 텍스트 키워드 매칭이라 오탐·미탐이 있을 수 있는 휴리스틱 — EFF-02 류와 동일한 한계
check = { kind = "hook", name = "check_frontend.py", how = "check_mobile() 이 homepage URL 의 HTML 에서 class/id/alt 에 banner·hero·배너·히어로가 들어간 <img>/<source> 중 srcset 도 없고 /_next/image 경로도 아닌 것을 찾아 참고로 보고" }
source = "https://developer.mozilla.org/en-US/docs/Web/HTML/Guides/Responsive_images"   # 2026-09-28 WebFetch 확인: srcset/sizes(해상도 스위칭), picture+source(아트 디렉션)

# 터치 타겟 최소 크기(WCAG 2.5.5, 44x44 CSS px — w3.org 2026-09-28 확인)는 여기서 별도 구현하지 않는다.
# 정적 HTML/코드만 봐서는 실제 렌더링된 픽셀 크기를 알 수 없고(CSS 계산 필요), 이미 FE-06/07 과 같은
# 층에서 lighthouse.yml(PageSpeed Insights) 워크플로의 accessibility 카테고리가 tap-target 검사를
# 포함하므로 그쪽에 위임한다 — 같은 것을 두 도구가 다르게 재구현하면 결과가 어긋날 수 있다.
